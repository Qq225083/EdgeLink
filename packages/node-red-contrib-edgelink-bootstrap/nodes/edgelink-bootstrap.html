<script type="text/html" data-template-name="edgelink-bootstrap">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> 名称</label>
        <input type="text" id="node-input-name" placeholder="EdgeLink 接入配置">
    </div>
    <div class="form-row">
        <label for="node-input-server"><i class="fa fa-server"></i> 后端地址</label>
        <input type="text" id="node-input-server" placeholder="如 192.168.1.10">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-plug"></i> 端口</label>
        <input type="number" id="node-input-port" placeholder="9099">
    </div>
    <div class="form-row">
        <label for="node-input-nodeKey"><i class="fa fa-key"></i> 节点标识</label>
        <input type="text" id="node-input-nodeKey" placeholder="如 pc-001（选填）">
    </div>
    <div class="form-row">
        <label for="node-input-hostPcIp"><i class="fa fa-desktop"></i> 本机IP:端口</label>
        <input type="text" id="node-input-hostPcIp" placeholder="选填，默认自动检测，如 192.168.1.10:1880">
    </div>
    <div class="form-row">
        <label for="node-input-secretKey"><i class="fa fa-lock"></i> 预分配密钥</label>
        <input type="password" id="node-input-secretKey" placeholder="管理端「边缘节点管理」创建时下发">
    </div>
</script>

<script type="text/html" data-help-name="edgelink-bootstrap">
    <h3>EdgeLink 接入配置</h3>
    <p>配置边缘采集节点的接入信息：后端地址 + 预分配密钥。<b>部署即生效</b>，无需改 settings.js、无需重启 Node-RED。</p>
    <p><b>预分配密钥</b> 在管理端「边缘节点管理」创建节点时生成，<b>仅显示一次</b>，请立即复制保存。</p>
    <h4>配置项</h4>
    <ul>
        <li><b>后端地址 / 端口</b>：EdgeLink 后端服务地址。</li>
        <li><b>节点标识</b>：选填，与管理端登记的 nodeKey 对应。</li>
        <li><b>本机IP:端口</b>：选填，留空则自动检测本机 IP 与监听端口。</li>
        <li><b>预分配密钥</b>：敏感信息，存于 <code>flows_cred.json</code>，不写入 <code>flows.json</code>。</li>
    </ul>
    <h4>注意</h4>
    <ul>
        <li>本节点<b>只能部署一个</b>（重复部署会红灯告警，仅首个生效）。</li>
        <li>本节点只写配置、不处理消息，拖入任意流即可（建议放在「配置管线」区域）。</li>
    </ul>
</script>

<script type="text/javascript">
    RED.nodes.registerType('edgelink-bootstrap', {
        category: 'config',
        color: '#a6d8a8',
        defaults: {
            name: { value: 'EdgeLink 接入配置' },
            server: { value: '', required: true },
            port: { value: 9099, required: true, validate: RED.validators.number() },
            nodeKey: { value: '' },
            hostPcIp: { value: '' }
        },
        credentials: {
            secretKey: { type: 'password' }
        },
        inputs: 0,
        outputs: 0,
        icon: 'font-awesome/fa-plug',
        label: function () {
            return this.name || 'EdgeLink 接入配置';
        }
    });
</script>
